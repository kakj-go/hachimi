name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-non-admin:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hachimi/ui exec playwright install chromium
      - run: pnpm check
      - run: pnpm release:check-clean
