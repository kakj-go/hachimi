<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hachimi Browser Host</title>
    <style>
      body {
        font:
          13px system-ui,
          sans-serif;
        margin: 16px;
        width: 300px;
        color: #202124;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.4;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
      }
      button {
        margin-top: 10px;
        padding: 8px 12px;
      }
      #status {
        min-height: 20px;
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <h1>Hachimi Browser Host</h1>
    <p>Start pairing in Hachimi, then paste the one-time code here.</p>
    <input id="nonce" autocomplete="off" placeholder="One-time pairing code" />
    <button id="pair" type="button">Pair this extension</button>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
