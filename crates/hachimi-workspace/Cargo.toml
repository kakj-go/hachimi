[package]
name = "hachimi-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
atomic-write-file.workspace = true
base64.workspace = true
hachimi-protocol.workspace = true
hachimi-process-policy.workspace = true
hachimi-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[dev-dependencies]
hachimi-agent.workspace = true
hachimi-approvals.workspace = true
hachimi-audit.workspace = true
hachimi-core.workspace = true
hachimi-llm.workspace = true
hachimi-policy.workspace = true
hachimi-protocol.workspace = true
hachimi-storage.workspace = true
hachimi-workbench.workspace = true
tempfile.workspace = true

[[bin]]
name = "hachimi-workspace-worker"
path = "src/bin/hachimi-workspace-worker.rs"
