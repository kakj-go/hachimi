[package]
name = "hachimi-cef-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "hachimi-cef-host"

[[bin]]
name = "bundle-hachimi-cef-host"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[package.metadata.cef.bundle]
helper_name = "hachimi-cef-host"

[dependencies]
base64.workspace = true
cef = { workspace = true, features = ["build-util"] }
hachimi-browser.workspace = true
hachimi-protocol.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
