[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/hachimi-agent",
  "crates/hachimi-approvals",
  "crates/hachimi-audit",
  "crates/hachimi-avatar",
  "crates/hachimi-browser",
  "crates/hachimi-capabilities",
  "crates/hachimi-computer",
  "crates/hachimi-control-plane",
  "crates/hachimi-core",
  "crates/hachimi-extensions",
  "crates/hachimi-enterprise",
  "crates/hachimi-forge",
  "crates/hachimi-gateway",
  "crates/hachimi-llm",
  "crates/hachimi-motion",
  "crates/hachimi-model-runtime",
  "crates/hachimi-policy",
  "crates/hachimi-process",
  "crates/hachimi-protocol",
  "crates/hachimi-sandbox",
  "crates/hachimi-scheduler",
  "crates/hachimi-skills",
  "crates/hachimi-storage",
  "crates/hachimi-user-input",
  "crates/hachimi-voice",
  "crates/hachimi-windowing",
  "crates/hachimi-workbench",
  "crates/hachimi-workspace",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["Hachimi contributors"]
publish = false

[workspace.dependencies]
atomic-write-file = "=0.3.0"
arboard = { version = "=3.6.1", default-features = false }
bzip2 = "=0.4.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
parking_lot = "=0.12.5"
cpal = "=0.17.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "stream"] }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["shared"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "macros", "migrate", "runtime-tokio", "sqlite-bundled", "time", "uuid"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
tauri = "=2.11.5"
tauri-plugin-notification = "=2.3.3"
tauri-runtime = "=2.11.3"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tempfile = "=3.27.0"
tar = "=0.4.46"
thiserror = "=2.0.19"
time = { version = "=0.3.54", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "=0.7.18"
tokio-stream = "=0.1.19"
tracing = "=0.1.44"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4", "v7"] }
zeroize = "=1.9.0"
zip = { version = "=8.2.0", default-features = false, features = ["deflate"] }
futures-util = "=0.3.32"
fs2 = "=0.4.3"
tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
libsqlite3-sys = "=0.37.0"
gltf = { version = "=1.4.1", default-features = false, features = ["names", "extras", "extensions", "utils"] }
headless_chrome = { version = "=1.0.22", default-features = false, features = ["offline"] }
base64 = "=0.22.1"
aes = "=0.8.4"
cbc = "=0.1.2"
hmac = "=0.12.1"
sha1 = "=0.10.7"
diff = "=0.1.13"
windows-sys = { version = "=0.61.2" }
windows = { version = "=0.62.2" }
windows-capture = "=2.0.0"

hachimi-agent = { path = "crates/hachimi-agent" }
hachimi-approvals = { path = "crates/hachimi-approvals" }
hachimi-audit = { path = "crates/hachimi-audit" }
hachimi-avatar = { path = "crates/hachimi-avatar" }
hachimi-browser = { path = "crates/hachimi-browser" }
hachimi-capabilities = { path = "crates/hachimi-capabilities" }
hachimi-computer = { path = "crates/hachimi-computer" }
hachimi-control-plane = { path = "crates/hachimi-control-plane" }
hachimi-core = { path = "crates/hachimi-core" }
hachimi-extensions = { path = "crates/hachimi-extensions" }
hachimi-enterprise = { path = "crates/hachimi-enterprise" }
hachimi-forge = { path = "crates/hachimi-forge" }
hachimi-gateway = { path = "crates/hachimi-gateway" }
hachimi-llm = { path = "crates/hachimi-llm" }
hachimi-motion = { path = "crates/hachimi-motion" }
hachimi-model-runtime = { path = "crates/hachimi-model-runtime" }
hachimi-policy = { path = "crates/hachimi-policy" }
hachimi-process = { path = "crates/hachimi-process" }
hachimi-protocol = { path = "crates/hachimi-protocol" }
hachimi-sandbox = { path = "crates/hachimi-sandbox" }
hachimi-scheduler = { path = "crates/hachimi-scheduler" }
hachimi-skills = { path = "crates/hachimi-skills" }
hachimi-storage = { path = "crates/hachimi-storage" }
hachimi-user-input = { path = "crates/hachimi-user-input" }
hachimi-voice = { path = "crates/hachimi-voice" }
hachimi-windowing = { path = "crates/hachimi-windowing" }
hachimi-workbench = { path = "crates/hachimi-workbench" }
hachimi-workspace = { path = "crates/hachimi-workspace" }
