[target.x86_64-pc-windows-msvc]
# AppContainer processes cannot assume the host VC runtime DLL is readable by application-package
# identities. Static CRT linkage keeps Workspace Worker, MCP stdio, and Sandbox canaries inside
# their exact file ACLs without widening a machine-wide system DLL ACL.
rustflags = ["-C", "target-feature=+crt-static"]
